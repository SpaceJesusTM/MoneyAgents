[project]
name = "rmats"
version = "0.1.0"
description = "Reproduction of RMATS: Recursive Multi-Agent Trading System (arXiv 2605.25311)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "hmmlearn>=0.3",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
